name: LaTeX CNB Mirror

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Personal release tag to mirror (empty uses latest)
        type: string
      repair_unpublished_tag:
        description: Repair only an empty unpublished draft tag; does not publish
        type: string
  # Releases published with GITHUB_TOKEN do not emit another release workflow.
  # This also handles publish-only runs made from older, immutable release tags.
  workflow_run:
    workflows: [LaTeX Source Build]
    types: [completed]

permissions:
  contents: read

jobs:
  mirror:
    if: >-
      github.repository == 'TwiceDrop/paseo-latex' &&
      !(github.event_name == 'workflow_dispatch' && inputs.repair_unpublished_tag) &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.event == 'workflow_dispatch' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    # Evaluate the job condition before taking a concurrency slot. Unrelated or
    # cancelled source runs must not replace a queued manual release migration.
    concurrency:
      group: latex-cnb-${{ github.event_name == 'push' && 'source' || 'release' }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check release verification and workflow contracts
        run: node --test scripts/upload-release-assets.test.mjs scripts/ci-workflow.test.mjs
      - name: Mirror source and verified installers to CNB
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_ONLY: ${{ github.event_name == 'push' }}
        run: node scripts/latex/sync-cnb.mjs

  repair:
    if: >-
      github.repository == 'TwiceDrop/paseo-latex' &&
      github.event_name == 'workflow_dispatch' && inputs.repair_unpublished_tag
    # GitHub only exposes draft releases to tokens with push access. Keep this
    # permission on the explicit repair job; ordinary CNB mirroring remains read-only.
    permissions:
      contents: write
    concurrency:
      group: latex-cnb-release
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check repair guards and workflow contracts
        run: node --test scripts/upload-release-assets.test.mjs scripts/ci-workflow.test.mjs
      - name: Repair only the checked unpublished CNB tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPAIR_UNPUBLISHED_TAG: ${{ inputs.repair_unpublished_tag }}
        run: node scripts/latex/sync-cnb.mjs

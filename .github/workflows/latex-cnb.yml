name: LaTeX CNB Mirror

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Personal release tag to mirror (empty uses latest)
        type: string
  # Releases published with GITHUB_TOKEN do not emit another release workflow.
  # This also handles publish-only runs made from older, immutable release tags.
  workflow_run:
    workflows: [LaTeX Source Build]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: latex-cnb-mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: >-
      github.repository == 'TwiceDrop/paseo-latex' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.event == 'workflow_dispatch' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check release verification and workflow contracts
        run: node --test scripts/upload-release-assets.test.mjs scripts/ci-workflow.test.mjs
      - name: Mirror source and verified installers to CNB
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_ONLY: ${{ github.event_name == 'push' }}
        run: node scripts/latex/sync-cnb.mjs

name: LaTeX Source Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_only:
        description: Publish verified existing Android and Windows build outputs
        type: boolean
        default: false
      release_tag:
        description: Existing personal release tag for publish-only mode
        type: string
      build_run_id:
        description: Successful Windows and Android build run ID for publish-only mode
        type: string
      android:
        description: Build the signed personal Android ARM64 APK
        type: boolean
        default: false
      windows:
        description: Build the independent Windows x64 installer
        type: boolean
        default: false
      revision:
        description: Personal build revision (1 through 99)
        type: string
        default: "1"

permissions:
  contents: read

concurrency:
  group: latex-source-${{ github.ref }}
  cancel-in-progress: true

env:
  ONNXRUNTIME_NODE_INSTALL: skip
  NODE_OPTIONS: --max-old-space-size=2048
  PASEO_LOW_MEMORY_BUILD: "1"
  GOMEMLIMIT: 1024MiB
  GOMAXPROCS: "2"
  CI: "1"

jobs:
  source:
    if: github.repository == 'TwiceDrop/paseo-latex' && !inputs.publish_only
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: node scripts/npm-retry.mjs ci --ignore-scripts --no-audit --no-fund
      - name: Apply tracked vendor patches
        run: npm run postinstall
      - name: Build clean-checkout dependencies and resources
        run: npm run latex:prepare
      - name: Compile bundled host and CLI
        run: |
          npm run build --workspace=@getpaseo/server
          npm run build --workspace=@getpaseo/cli
      - name: Typecheck clients
        run: |
          npm run typecheck --workspace=@getpaseo/app
          npm run typecheck --workspace=@getpaseo/client
          npm run typecheck --workspace=@getpaseo/desktop
      - name: Lint
        run: npm run lint -- --threads=2
      - name: Check workflow contracts
        run: node --test scripts/ci-workflow.test.mjs scripts/upload-release-assets.test.mjs
      - name: Check desktop updater behavior
        run: npm run test --workspace=@getpaseo/desktop -- src/features/auto-updater.test.ts src/features/app-update-service.test.ts --maxWorkers=1 --bail=1
      - name: Run targeted client regression tests
        run: npm run test --workspace=@getpaseo/app -- --project unit app.config.test.ts native-release-version.test.ts src/desktop/updates/desktop-app-updater.test.ts src/desktop/updates/desktop-updates.test.ts src/file-pane/document-preview/model.test.ts src/file-panels/catalog.test.ts src/components/markdown/renderer.test.ts src/components/markdown/math/source.test.ts --maxWorkers=1 --bail=1
      - name: Install browser runtime
        run: npm exec -- playwright install --with-deps chromium
      - name: Run real document and math browser regression tests
        run: npm run test:browser --workspace=@getpaseo/app -- src/file-pane/document-preview/runtime.browser.test.ts src/components/markdown/math/enriched.browser.test.tsx src/components/settings/row-density.browser.test.tsx --maxWorkers=1
      - name: Run sidebar and document preview regression tests
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          E2E_RECORD_VIDEO: "1"
        run: npm run test:e2e --workspace=@getpaseo/app -- e2e/browser/sidebar-reorder.spec.ts e2e/browser/document-preview.spec.ts --workers=1
      - name: Upload UI regression evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: latex-ui-regressions-${{ github.sha }}
          path: |
            packages/app/test-results
            packages/app/src/components/settings/.vitest-screenshots
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Compile the personal web client
        run: npm run latex:web
      - name: Check source formatting
        run: |
          npm run format -- --threads=2
          mkdir -p artifacts
          git diff --binary > artifacts/latex-source-format.patch
          git diff --exit-code
      - name: Upload compiled web client
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: paseo-latex-web-${{ github.sha }}
          path: packages/app/dist
          retention-days: 7
      - name: Upload formatting diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: latex-source-diagnostics-${{ github.sha }}
          path: artifacts/latex-source-format.patch
          if-no-files-found: ignore
          retention-days: 7

  android:
    if: github.repository == 'TwiceDrop/paseo-latex' && github.event_name == 'workflow_dispatch' && inputs.android
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Restore existing personal Android signing
        env:
          PASEO_LATEX_SIGNING_DIR: ${{ runner.temp }}/paseo-latex-signing
          PASEO_LATEX_KEYSTORE_BASE64: ${{ secrets.PASEO_LATEX_KEYSTORE_BASE64 }}
          PASEO_LATEX_CREDENTIALS_JSON: ${{ secrets.PASEO_LATEX_CREDENTIALS_JSON }}
        shell: bash
        run: |
          printf 'PASEO_LATEX_SIGNING_DIR=%s\n' "$PASEO_LATEX_SIGNING_DIR" >> "$GITHUB_ENV"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          const { PASEO_LATEX_SIGNING_DIR: directory, PASEO_LATEX_KEYSTORE_BASE64: keystore, PASEO_LATEX_CREDENTIALS_JSON: credentials } = process.env;
          if (!keystore || !credentials) {
            throw new Error('Configure PASEO_LATEX_KEYSTORE_BASE64 and PASEO_LATEX_CREDENTIALS_JSON from the existing personal signing files. Do not generate a new key.');
          }
          let parsed;
          try {
            parsed = JSON.parse(credentials);
          } catch {
            throw new Error('The existing personal signing credentials must be valid JSON.');
          }
          if (parsed.alias !== 'paseo-latex' || typeof parsed.password !== 'string' || parsed.password.length < 24) {
            throw new Error('The existing personal signing credentials are invalid.');
          }
          fs.mkdirSync(directory, { recursive: true, mode: 0o700 });
          fs.writeFileSync(path.join(directory, 'release.keystore'), Buffer.from(keystore, 'base64'), { mode: 0o600 });
          fs.writeFileSync(path.join(directory, 'credentials.json'), credentials, { mode: 0o600 });
          JS
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          # Command-line tools 21.0; the legacy "tools" package is no longer published.
          cmdline-tools-version: "15641748"
          packages: "platform-tools"
      - name: Install locked dependencies and personal patches
        run: |
          node scripts/npm-retry.mjs ci --ignore-scripts --no-audit --no-fund
          npm run postinstall
          npm rebuild @shopify/react-native-skia --foreground-scripts
      - name: Build signed personal Android ARM64 APK
        env:
          PASEO_LATEX_BUILD_REVISION: ${{ inputs.revision }}
        run: npm run android:latex -- --arch arm64-v8a --low-memory --revision "$PASEO_LATEX_BUILD_REVISION"
      - name: Verify APK signing and personal identity
        shell: bash
        run: |
          set -euo pipefail
          apk=(artifacts/paseo-latex-*-r*.apk)
          test "${#apk[@]}" -eq 1
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$apksigner" verify --verbose --print-certs "${apk[0]}"
          test "$(apkanalyzer manifest application-id "${apk[0]}")" = "sh.paseo.latex"
      - uses: actions/upload-artifact@v4
        with:
          name: paseo-latex-android-${{ github.sha }}
          path: artifacts/paseo-latex-*-r*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Remove restored signing files
        if: ${{ always() }}
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/paseo-latex-signing"

  windows:
    if: github.repository == 'TwiceDrop/paseo-latex' && github.event_name == 'workflow_dispatch' && inputs.windows
    needs: source
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: node scripts/npm-retry.mjs ci --ignore-scripts --no-audit --no-fund
      - name: Apply tracked vendor patches
        run: npm run postinstall
      - name: Build independent Windows installer
        env:
          PASEO_LATEX_BUILD_REVISION: ${{ inputs.revision }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run windows:latex -- --revision $env:PASEO_LATEX_BUILD_REVISION
      - uses: actions/upload-artifact@v4
        with:
          name: paseo-latex-windows-${{ github.sha }}
          path: artifacts/windows-latex-*/Paseo-LaTeX-Setup-*.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.repository == 'TwiceDrop/paseo-latex' && github.event_name == 'workflow_dispatch' && inputs.publish_only
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
    steps:
      - name: Verify release and both build sources
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^latex-v[0-9]+\.[0-9]+\.[0-9]+-r[1-9][0-9]?$ ]]
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > build-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/jobs?per_page=100" > build-jobs.json
          EXPECTED_SOURCE_SHA="$sha" node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const run = JSON.parse(fs.readFileSync('build-run.json'));
          assert.equal(run.head_sha, process.env.EXPECTED_SOURCE_SHA);
          assert.equal(run.head_repository.full_name, process.env.GITHUB_REPOSITORY);
          assert.equal(run.event, 'workflow_dispatch');
          assert.equal(run.path, '.github/workflows/latex-source.yml');
          const jobs = JSON.parse(fs.readFileSync('build-jobs.json')).jobs;
          for (const name of ['source', 'windows', 'android']) {
            const matches = jobs.filter(job => job.name === name);
            assert.equal(matches.length, 1);
            assert.equal(matches[0].conclusion, 'success', `${name} build must succeed`);
          }
          JS
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: paseo-latex-windows-${{ steps.source.outputs.sha }}
          path: windows
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.build_run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: paseo-latex-android-${{ steps.source.outputs.sha }}
          path: android
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.build_run_id }}
      - name: Prepare installers and versioned update manifest
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import { personalVersion, writeReleaseMetadata } from './source/scripts/latex/release-manifest.mjs';
          const { version, revision } = personalVersion(process.env.RELEASE_TAG);
          fs.mkdirSync('publish');
          for (const [directory, name] of [
            ['android', `paseo-latex-${version}-r${revision}.apk`],
            ['windows', `Paseo-LaTeX-Setup-${version}-r${revision}-x64.exe`],
          ]) {
            const matches = fs.readdirSync(directory, { recursive: true }).filter(file => path.basename(file) === name);
            assert.equal(matches.length, 1, name);
            fs.copyFileSync(path.join(directory, matches[0]), path.join('publish', name));
          }
          await writeReleaseMetadata('publish', process.env.RELEASE_TAG);
          JS
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify original Android signature, application ID and revision
        shell: bash
        run: |
          set -euo pipefail
          apk=(publish/*.apk)
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          apkanalyzer="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/apkanalyzer' -type f | sort -V | tail -n 1)"
          "$apksigner" verify --print-certs "${apk[0]}" > certificate.txt
          actual="$(sed -nE 's/^(Signer #[0-9]+|V[0-9.]+ Signer): certificate SHA-256 digest: //p' certificate.txt | tr -d '\r' | tr 'A-F' 'a-f' | sort -u)"
          test "$actual" = eaf82adb5bbbe201a5304a3eee00cd0f9d135789d5a47bcd3b776d96dbd4d8fb
          test "$("$apkanalyzer" manifest application-id "${apk[0]}")" = sh.paseo.latex
          expected_version="${RELEASE_TAG#latex-v}"
          expected_version="${expected_version%-r*}"
          test "$("$apkanalyzer" manifest version-name "${apk[0]}")" = "$expected_version"
          expected_code="$(node --input-type=module -e 'import {personalVersion} from "./source/scripts/latex/release-manifest.mjs"; import native from "./source/packages/app/native-release-version.js"; const v=personalVersion(process.env.RELEASE_TAG); console.log(native.getLatexVersionCode(v.version,v.revision))')"
          test "$("$apkanalyzer" manifest version-code "${apk[0]}")" = "$expected_code"
          (cd publish && sha256sum --check SHA256SUMS.txt)
      - name: Upload verified installers, update metadata and publish
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" publish/*.apk publish/*.exe publish/latest.yml publish/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

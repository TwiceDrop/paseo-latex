name: LaTeX Source Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_only:
        description: Publish verified existing Android and Windows build outputs
        type: boolean
        default: false
      release_tag:
        description: Existing personal release tag for publish-only mode
        type: string
      build_run_id:
        description: Successful Windows build run ID for publish-only mode
        type: string
      android_assets_ref:
        description: Temporary branch containing APK parts and their checksum manifest
        type: string
      android:
        description: Build the signed personal Android ARM64 APK
        type: boolean
        default: false
      windows:
        description: Build the independent Windows x64 installer
        type: boolean
        default: false
      revision:
        description: Personal build revision (1 through 99)
        type: string
        default: "1"

permissions:
  contents: read

concurrency:
  group: latex-source-${{ github.ref }}
  cancel-in-progress: true

env:
  ONNXRUNTIME_NODE_INSTALL: skip
  NODE_OPTIONS: --max-old-space-size=2048
  PASEO_LOW_MEMORY_BUILD: "1"
  GOMEMLIMIT: 1024MiB
  GOMAXPROCS: "2"
  CI: "1"

jobs:
  source:
    if: github.repository == 'TwiceDrop/paseo-latex' && !inputs.publish_only
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: node scripts/npm-retry.mjs ci --ignore-scripts --no-audit --no-fund
      - name: Apply tracked vendor patches
        run: npm run postinstall
      - name: Build clean-checkout dependencies and resources
        run: npm run latex:prepare
      - name: Compile bundled host and CLI
        run: |
          npm run build --workspace=@getpaseo/server
          npm run build --workspace=@getpaseo/cli
      - name: Typecheck clients
        run: |
          npm run typecheck --workspace=@getpaseo/app
          npm run typecheck --workspace=@getpaseo/client
          npm run typecheck --workspace=@getpaseo/desktop
      - name: Lint
        run: npm run lint -- --threads=2
      - name: Check workflow contracts
        run: node --test scripts/ci-workflow.test.mjs
      - name: Run targeted client regression tests
        run: npm run test --workspace=@getpaseo/app -- --project unit src/file-pane/document-preview/model.test.ts src/file-panels/catalog.test.ts src/components/markdown/renderer.test.ts src/components/markdown/math/source.test.ts --maxWorkers=1 --bail=1
      - name: Install browser runtime
        run: npm exec -- playwright install --with-deps chromium
      - name: Run real document and math browser regression tests
        run: npm run test:browser --workspace=@getpaseo/app -- src/file-pane/document-preview/runtime.browser.test.ts src/components/markdown/math/enriched.browser.test.tsx --maxWorkers=1
      - name: Compile the personal web client
        run: npm run latex:web
      - name: Check source formatting
        run: |
          npm run format -- --threads=2
          mkdir -p artifacts
          git diff --binary > artifacts/latex-source-format.patch
          git diff --exit-code
      - name: Upload compiled web client
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: paseo-latex-web-${{ github.sha }}
          path: packages/app/dist
          retention-days: 7
      - name: Upload formatting diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: latex-source-diagnostics-${{ github.sha }}
          path: artifacts/latex-source-format.patch
          if-no-files-found: ignore
          retention-days: 7

  android:
    if: github.repository == 'TwiceDrop/paseo-latex' && github.event_name == 'workflow_dispatch' && inputs.android
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Restore existing personal Android signing
        env:
          PASEO_LATEX_SIGNING_DIR: ${{ runner.temp }}/paseo-latex-signing
          PASEO_LATEX_KEYSTORE_BASE64: ${{ secrets.PASEO_LATEX_KEYSTORE_BASE64 }}
          PASEO_LATEX_CREDENTIALS_JSON: ${{ secrets.PASEO_LATEX_CREDENTIALS_JSON }}
        shell: bash
        run: |
          printf 'PASEO_LATEX_SIGNING_DIR=%s\n' "$PASEO_LATEX_SIGNING_DIR" >> "$GITHUB_ENV"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          const { PASEO_LATEX_SIGNING_DIR: directory, PASEO_LATEX_KEYSTORE_BASE64: keystore, PASEO_LATEX_CREDENTIALS_JSON: credentials } = process.env;
          if (!keystore || !credentials) {
            throw new Error('Configure PASEO_LATEX_KEYSTORE_BASE64 and PASEO_LATEX_CREDENTIALS_JSON from the existing personal signing files. Do not generate a new key.');
          }
          let parsed;
          try {
            parsed = JSON.parse(credentials);
          } catch {
            throw new Error('The existing personal signing credentials must be valid JSON.');
          }
          if (parsed.alias !== 'paseo-latex' || typeof parsed.password !== 'string' || parsed.password.length < 24) {
            throw new Error('The existing personal signing credentials are invalid.');
          }
          fs.mkdirSync(directory, { recursive: true, mode: 0o700 });
          fs.writeFileSync(path.join(directory, 'release.keystore'), Buffer.from(keystore, 'base64'), { mode: 0o600 });
          fs.writeFileSync(path.join(directory, 'credentials.json'), credentials, { mode: 0o600 });
          JS
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install locked dependencies and personal patches
        run: |
          node scripts/npm-retry.mjs ci --ignore-scripts --no-audit --no-fund
          npm run postinstall
          npm rebuild @shopify/react-native-skia --foreground-scripts
      - name: Build signed personal Android ARM64 APK
        env:
          PASEO_LATEX_BUILD_REVISION: ${{ inputs.revision }}
        run: npm run android:latex -- --arch arm64-v8a --low-memory --revision "$PASEO_LATEX_BUILD_REVISION"
      - name: Verify APK signing and personal identity
        shell: bash
        run: |
          set -euo pipefail
          apk=(artifacts/paseo-latex-*-r*.apk)
          test "${#apk[@]}" -eq 1
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$apksigner" verify --verbose --print-certs "${apk[0]}"
          test "$(apkanalyzer manifest application-id "${apk[0]}")" = "sh.paseo.latex"
      - uses: actions/upload-artifact@v4
        with:
          name: paseo-latex-android-${{ github.sha }}
          path: artifacts/paseo-latex-*-r*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Remove restored signing files
        if: ${{ always() }}
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/paseo-latex-signing"

  windows:
    if: github.repository == 'TwiceDrop/paseo-latex' && github.event_name == 'workflow_dispatch' && inputs.windows
    needs: source
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: node scripts/npm-retry.mjs ci --ignore-scripts --no-audit --no-fund
      - name: Apply tracked vendor patches
        run: npm run postinstall
      - name: Build independent Windows installer
        env:
          PASEO_LATEX_BUILD_REVISION: ${{ inputs.revision }}
        run: npm run windows:latex -- --revision $env:PASEO_LATEX_BUILD_REVISION
      - uses: actions/upload-artifact@v4
        with:
          name: paseo-latex-windows-${{ github.sha }}
          path: artifacts/windows-latex-*/Paseo-LaTeX-Setup-*.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.repository == 'TwiceDrop/paseo-latex' && github.event_name == 'workflow_dispatch' && inputs.publish_only
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      ANDROID_ASSETS_REF: ${{ inputs.android_assets_ref }}
    steps:
      - name: Verify release and build source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^latex-v[0-9]+\.[0-9]+\.[0-9]+-r[1-9][0-9]?$ ]]
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          test "$ANDROID_ASSETS_REF" = "build-assets/$RELEASE_TAG"
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" --jq .head_sha)" = "$sha"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/jobs" --jq '[.jobs[] | select(.name == "source" or .name == "windows")] | length == 2 and all(.[]; .conclusion == "success")')" = true
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: paseo-latex-windows-${{ steps.source.outputs.sha }}
          path: windows
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.build_run_id }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.android_assets_ref }}
          path: incoming
          persist-credentials: false
      - name: Reconstruct and verify release files
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          const manifest = JSON.parse(fs.readFileSync('incoming/manifest.json', 'utf8'));
          assert.equal(manifest.sourceSha, process.env.EXPECTED_SOURCE_SHA);
          const [, version, revision] = /^latex-v([0-9]+\.[0-9]+\.[0-9]+)-r([1-9][0-9]?)$/.exec(process.env.RELEASE_TAG);
          const apkName = `paseo-latex-${version}-r${revision}.apk`;
          const exeName = `Paseo-LaTeX-Setup-${version}-r${revision}-x64.exe`;
          assert.equal(manifest.fileName, apkName);
          assert.match(manifest.sha256, /^[a-f0-9]{64}$/);
          assert.match(manifest.windowsSha256, /^[a-f0-9]{64}$/);
          assert.match(manifest.certificateSha256, /^[a-f0-9]{64}$/);
          assert.ok(Array.isArray(manifest.parts) && manifest.parts.length > 0 && manifest.parts.length <= 64);
          assert.equal(new Set(manifest.parts).size, manifest.parts.length);
          fs.mkdirSync('publish');
          const digest = crypto.createHash('sha256');
          const fd = fs.openSync(path.join('publish', apkName), 'wx');
          let size = 0;
          try {
            for (const [index, part] of manifest.parts.entries()) {
              assert.equal(part, `apk.part${String(index).padStart(3, '0')}`);
              const bytes = fs.readFileSync(path.join('incoming', part));
              digest.update(bytes);
              size += bytes.length;
              fs.writeFileSync(fd, bytes);
            }
          } finally {
            fs.closeSync(fd);
          }
          assert.equal(size, manifest.size);
          assert.equal(digest.digest('hex'), manifest.sha256);
          const installers = fs.readdirSync('windows', { recursive: true }).filter(file => path.basename(file) === exeName);
          assert.equal(installers.length, 1);
          const windows = fs.readFileSync(path.join('windows', installers[0]));
          assert.equal(windows.subarray(0, 2).toString(), 'MZ');
          assert.equal(crypto.createHash('sha256').update(windows).digest('hex'), manifest.windowsSha256);
          fs.writeFileSync(path.join('publish', exeName), windows, { flag: 'wx' });
          fs.writeFileSync('publish/SHA256SUMS.txt', `${manifest.sha256}  ${apkName}\n${manifest.windowsSha256}  ${exeName}\n`);
          console.log('Both release files match their verified SHA-256 checksums and source commit.');
          JS
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify Android signature and application ID
        shell: bash
        run: |
          set -euo pipefail
          apk=(publish/*.apk)
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          apkanalyzer="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/apkanalyzer' -type f | sort -V | tail -n 1)"
          "$apksigner" verify --print-certs "${apk[0]}" > certificate.txt
          cat certificate.txt
          expected="$(node -pe "JSON.parse(require('fs').readFileSync('incoming/manifest.json')).certificateSha256")"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' certificate.txt | tr -d '\r' | tr 'A-F' 'a-f')"
          printf 'Expected certificate SHA-256: %s\nActual certificate SHA-256: %s\n' "$expected" "$actual"
          test "$actual" = "$expected"
          app_id="$("$apkanalyzer" manifest application-id "${apk[0]}")"
          printf 'Application ID: %s\n' "$app_id"
          test "$app_id" = sh.paseo.latex
      - name: Upload verified files and publish release
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" publish/*.apk publish/*.exe publish/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
